<!-- P3R「Sea of Souls」背景：单个固定层 + 两个伪元素，纯 CSS（样式见 assets/css/about.css）。
     .p3r-page 是 custom.css 中 body:has(.p3r-page) 透明化规则的钩子，类名需保留。 -->
<div class="ab-bg" aria-hidden="true"></div>

<div class="p3r-page">
  <div class="row">
    <div class="col-12">
      <div id="page" class="post px-1 pr-md-2">
        <div class="post-content">
          {{ content }}
        </div>
      </div>
    </div>
  </div>
</div>
